<!DOCTYPE html>
<html>
<head>
    <title>SHARVANAS STORES</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:0;
        }

        .navbar{
            background:#222;
            color:white;
            padding:15px;
            display:flex;
            justify-content:space-between;
        }

        .container{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
            padding:30px;
        }

        .card{
            background:white;
            width:220px;
            padding:20px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 3px 10px rgba(0,0,0,0.2);
        }

        .emoji{
            font-size:50px;
        }

        .btn{
            background:#28a745;
            color:white;
            border:none;
            padding:10px 15px;
            border-radius:8px;
            cursor:pointer;
            text-decoration:none;
            display:inline-block;
            margin:5px;
        }

        .buy-btn{
            background:#ff9800;
        }

        .bill{
            text-align:center;
            font-size:22px;
            margin-bottom:20px;
        }

        .cart{
            width:80%;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0 3px 10px rgba(0,0,0,0.2);
            margin-bottom:30px;
        }

        .clear-btn{
            background:red;
            color:white;
            padding:10px 15px;
            text-decoration:none;
            border-radius:8px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>🛒 SHARVANAS STORES</h2>
    <h3>Cart: {{ cart_count }}</h3>
</div>

<div class="container">

{% for p in products %}
<div class="card">

    <div class="emoji">{{ p.emoji }}</div>

    <h2>{{ p.name }}</h2>

    <h3>₹{{ p.price }}</h3>

    <a class="btn" href="/add/{{ p.id }}">
        Add to Cart
    </a>

    <a class="btn buy-btn" href="/buy/{{ p.id }}">
        Buy Now
    </a>

</div>
{% endfor %}

</div>

<div class="cart">

<h2>🛍 Cart Items</h2>
<ul>
{% for item in cart %}
<li>{{ item.name }} - ₹{{ item.price }}</li>
{% endfor %}
</ul>

<div class="bill">
    <b>Total Bill: ₹{{ total }}</b>
</div>

<a class="clear-btn" href="/clear">
    Clear Cart
</a>

</div>

</body>
</html>
