<!DOCTYPE html>
<html>
<head>
    <title>Order Placed</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 3px 10px rgba(0,0,0,0.2);
        }

        .success{
            font-size:70px;
        }

        .btn{
            background:#007bff;
            color:white;
            text-decoration:none;
            padding:10px 20px;
            border-radius:8px;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="success">✅</div>

    <h1>Order Placed Successfully!</h1>

    <h2>{{ product.emoji }} {{ product.name }}</h2>

    <h3>Price: ₹{{ product.price }}</h3>

    <p>Thank you for shopping with us.</p>

    <br>

    <a class="btn" href="/">
        Continue Shopping
    </a>

</div>

</body>
</html>
